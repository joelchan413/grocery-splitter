services:
  grocery-splitter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grocery-splitter
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
